{{- /* Root-relative paths must carry the baseURL path, since the site is served from a GitHub Pages subpath. */ -}}
{{- $src := .Destination -}}
{{- if and (hasPrefix $src "/") (not (hasPrefix $src "//")) -}}
  {{- $src = relURL (strings.TrimPrefix "/" $src) -}}
{{- end -}}
<img src="{{ $src | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy">
